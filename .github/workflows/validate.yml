name: Validate MPX4 Specification

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Verify generated TCP fixtures
        run: python tools/generate_tcp_fixtures.py --check
      - name: Validate specification and vectors
        run: python tools/validate.py
      - name: Validate specification under Python optimization
        run: python -O tools/validate.py
      - name: Mutation tests
        run: python tools/mutation_test.py
      - name: Anchor executable reference to canonical vectors
        run: python -m reference.selftest
      - name: Reference Gate 1 real-TCP integration
        run: python reference/interop_harness.py --out-dir "$RUNNER_TEMP/mpx4-gate1"
      - name: Reference Gate 1 fragmented TCP integration
        run: python reference/interop_harness.py --out-dir "$RUNNER_TEMP/mpx4-gate1-fragmented" --case-id gate1-proxy-fragmented --write-chunk 257 --proxy-max-chunk 1024
      - name: Reference Gate 2 fault and recovery integration
        run: python reference/gate2_harness.py --out-dir "$RUNNER_TEMP/mpx4-gate2"
      - name: Reference Gate 2 fragmented-write fault and recovery integration
        run: python reference/gate2_harness.py --out-dir "$RUNNER_TEMP/mpx4-gate2-fragmented" --write-chunk 257
      - name: Authenticated endpoint-wire negative and positive controls
        run: python -m interop.endpoint_wire --out-dir "$RUNNER_TEMP/mpx4-endpoint-wire"
      - name: Formerly-model-only Mandatory endpoint execution
        run: python -m interop.endpoint_mandatory --out-dir "$RUNNER_TEMP/mpx4-endpoint-mandatory"
      - name: Endpoint coverage sensitivity controls
        run: python -m interop.endpoint_sensitivity --out-dir "$RUNNER_TEMP/mpx4-endpoint-sensitivity"
      - name: Reference Gate 3 model-zero Mandatory profile
        run: python -m reference.gate3_harness --out-dir "$RUNNER_TEMP/mpx4-gate3"
      - name: Independent implementation canonical self-test
        run: python -m independent.selftest
      - name: Gate 4 source-isolated A/B aggregate with endpoint evidence
        run: python -m interop.gate4_harness --out-dir "$RUNNER_TEMP/mpx4-gate4"
      - name: Ensure generated files are committed
        run: git diff --exit-code
